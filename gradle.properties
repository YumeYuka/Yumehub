# TLSv1.2 is forced because the JVM's TLSv1.3 handshake to maven.pkg.github.com
# gets terminated by the local network; GitHub Packages (lucide-compose) requires TLS >= 1.2.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# 30+ Compose 模块共用 Kotlin 守护进程；默认堆偏小，增量编译易反复 GC。
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
