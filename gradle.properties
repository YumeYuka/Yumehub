# TLSv1.2 is forced because the JVM's TLSv1.3 handshake to maven.pkg.github.com
# gets terminated by the local network; GitHub Packages (lucide-compose) requires TLS >= 1.2.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
