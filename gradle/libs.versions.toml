[versions]
agp = "9.4.1"
aaptProto = "9.4.1-15978811"
protobuf = "3.25.9"
kotlin = "2.4.21"
ktfmt = "0.65"

coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
loaderAnnotation = "1.11.0"
hiddenApiBypass = "6.2"
xz = "1.12"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationevent = "1.2.0"
composeBom = "2026.09.00"
paging = "3.5.3"
mmkv = "2.4.3"
sketch = "4.7.0"

coroutines = "1.11.0"
serialization = "1.12.0"
koin = "4.2.2"

miuix = "0.9.5-ae3be934-SNAPSHOT"
glasmio = "0.1.4"
decompose = "3.5.0"
lucide = "1.0.0-SNAPSHOT"

appauth = "0.11.1"
okhttp = "5.5.1"
retrofit = "3.0.0"
lyricist = "1.9.0"
sora = "0.24.7"
junit = "4.13.2"
jsoup = "1.24.1"
desugarJdk = "2.1.5"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
androidxEspresso = "3.7.0"

[libraries]
# Build-logic classpath (convention plugins).
aapt-proto = { module = "com.android.tools.build:aapt2-proto", version.ref = "aaptProto" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version.ref = "ktfmt" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
loader-annotation = { module = "androidx.annotation:annotation-jvm", version.ref = "loaderAnnotation" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenApiBypass" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationevent" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
android-desugar-jdk-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarJdk" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Locale-aware Compose strings (same runtime as YumeBox).
lyricist = { module = "cafe.adriel.lyricist:lyricist", version.ref = "lyricist" }

mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
sketch-compose = { module = "io.github.panpf.sketch4:sketch-compose", version.ref = "sketch" }
sketch-http-okhttp = { module = "io.github.panpf.sketch4:sketch-http-okhttp", version.ref = "sketch" }
sketch-svg = { module = "io.github.panpf.sketch4:sketch-svg", version.ref = "sketch" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass-android", version.ref = "miuix" }

# Navigation stack (same runtime and version as YumeBox).
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensions-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }

glasmio-core = { module = "io.github.neoruaa.glasmio:glasmio-core", version.ref = "glasmio" }
glasmio-glass = { module = "io.github.neoruaa.glasmio:glasmio-glass", version.ref = "glasmio" }
glasmio-ui = { module = "io.github.neoruaa.glasmio:glasmio-ui", version.ref = "glasmio" }
glasmio-scaffold = { module = "io.github.neoruaa.glasmio:glasmio-scaffold", version.ref = "glasmio" }
glasmio-icons = { module = "io.github.neoruaa.glasmio:glasmio-icons", version.ref = "glasmio" }

lucide-compose = { module = "io.github.YumeYucca:lucide-compose", version.ref = "lucide" }

appauth = { module = "net.openid:appauth", version.ref = "appauth" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

sora-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "sora" }
sora-oniguruma-native = { module = "io.github.rosemoe:oniguruma-native", version.ref = "sora" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
