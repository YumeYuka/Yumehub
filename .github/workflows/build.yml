name: Android CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - Moe
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  format:
    name: ktfmt
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-37.2"

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles(
            'gradle/**', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: ktfmt check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew --no-daemon ktfmtCheck

  build:
    name: APK
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: >-
            platform-tools platforms;android-37.2 build-tools;37.0.0
            ndk;27.1.12297006 cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles(
            'gradle/**', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Assemble debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf build/ci-artifacts
          mkdir -p build/ci-artifacts

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            label="pr-${PR_NUMBER}"
            short_sha="${PR_HEAD_SHA:0:7}"
          else
            label="$(printf '%s' "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
            short_sha="${GITHUB_SHA:0:7}"
          fi

          count=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            count=$((count + 1))
            "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --verbose "$apk"

            out_name="Yumehub-${label}-${short_sha}-debug.apk"
            if [ "$count" -gt 1 ]; then
              out_name="Yumehub-${label}-${short_sha}-${count}-debug.apk"
            fi
            cp "$apk" "build/ci-artifacts/${out_name}"

            size="$(du -h "build/ci-artifacts/${out_name}" | cut -f1)"
            sha256="$(sha256sum "build/ci-artifacts/${out_name}" | awk '{print $1}')"
            {
              echo "### Debug APK"
              echo "- **File**: \`${out_name}\`"
              echo "- **Size**: ${size}"
              echo "- **SHA-256**: \`${sha256}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done

          test "$count" -gt 0

      - name: Upload APK
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ github.event_name == 'pull_request' && format('apk-debug-pr-{0}', github.event.pull_request.number) || 'apk-debug' }}
          path: build/ci-artifacts/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
          compression-level: 0
          if-no-files-found: error
